name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries also run against code that has not changed.
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin is only analyzed from a real compile, so this job builds the project.
          - language: java-kotlin
            build-mode: manual
          # The NDK sources (native/, mobshield-*/src/main/cpp) are read without a build.
          - language: c-cpp
            build-mode: none
          # The workflow files themselves.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build
        if: matrix.build-mode == 'manual'
        # No daemon and no build cache, so every Kotlin/Java source is compiled under CodeQL.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
