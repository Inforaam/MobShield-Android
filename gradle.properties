org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

GROUP=io.github.inforaam

# Release builds pass the version from the git tag (v1.2.3 -> -PVERSION_NAME=1.2.3); JitPack passes
# its build version the same way. Local and source builds are 0.0.0-SNAPSHOT unless you set
# VERSION_NAME (or mobshield.version) yourself.

# Sonatype Central Portal (set in CI via ORG_GRADLE_PROJECT_*)
# mavenCentralUsername=
# mavenCentralPassword=

# GPG signing (in-memory key from GitHub Secrets in CI)
# signingInMemoryKey=
# signingInMemoryKeyPassword=
